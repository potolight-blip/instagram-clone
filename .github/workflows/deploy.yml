name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_DIR: /var/www/muksta
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up SSH key
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          if [ -z "$SERVER_HOST" ] || [ -z "$SERVER_USER" ] || [ -z "$SERVER_SSH_KEY" ]; then
            echo "::error::Secrets are missing. Set SERVER_HOST, SERVER_USER, and SERVER_SSH_KEY."
            exit 1
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Upload deploy.sh to the server
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new -o IdentitiesOnly=yes \
            scripts/deploy.sh "$SERVER_USER@$SERVER_HOST:$APP_DIR/deploy.sh"

      - name: Run deploy.sh on the server
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new -o IdentitiesOnly=yes \
            "$SERVER_USER@$SERVER_HOST" "bash -l $APP_DIR/deploy.sh"

      - name: Report success
        if: success()
        run: echo "### Deploy succeeded (${GITHUB_SHA::7})" >> "$GITHUB_STEP_SUMMARY"

      - name: Report failure
        if: failure()
        run: |
          echo "### Deploy failed (${GITHUB_SHA::7})" >> "$GITHUB_STEP_SUMMARY"
          echo "Open the failed step above to see the server log." >> "$GITHUB_STEP_SUMMARY"

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
